name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 설정 파일 만들기
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          # 선택: Google 공식 로그인 버튼용 OAuth 웹 클라이언트 ID(공개 값, 저장소 Variables). 없으면 예전 버튼.
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: |
          python3 - << 'PY'
          import json, os, pathlib, re
          url = os.environ.get("SUPABASE_URL", "").strip().rstrip("/")
          key = os.environ.get("SUPABASE_PUBLISHABLE_KEY", "").strip()
          if not url.startswith("https://") or not url.endswith(".supabase.co"):
              raise SystemExit("SUPABASE_URL 이 비어 있거나 형식이 아닙니다.")
          if (not key) or ("YOUR_KEY" in key) or key.startswith("sb_secret_"):
              raise SystemExit("Publishable key만 GitHub Secret에 넣을 수 있습니다.")
          google = os.environ.get("GOOGLE_CLIENT_ID", "").strip()
          if google and not re.fullmatch(r"[0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com", google):
              raise SystemExit("GOOGLE_CLIENT_ID 형식이 아닙니다(…apps.googleusercontent.com).")
          text = (
              "export const config = {\n"
              f"  supabaseUrl: {json.dumps(url)},\n"
              f"  supabasePublishableKey: {json.dumps(key)},\n"
              f"  googleClientId: {json.dumps(google)},\n"
              "};\n"
          )
          pathlib.Path("js/config.js").write_text(text, encoding="utf-8")
          PY

      - name: 공개할 파일만 모으기
        run: |
          mkdir -p _site
          cp index.html privacy.html terms.html robots.txt sitemap.xml .nojekyll favicon.ico favicon-32x32.png apple-touch-icon.png _site/
          cp -r css js img _site/
          # 기능 소개 페이지(검색 색인용, /dojo/ 등)
          cp -r dojo maker chaos-scroll level-up monster-park monsters items transport _site/

      - name: 파일 주소에 버전 붙이기
        # 배포마다 커밋 번호를 JS·CSS 주소에 붙여 브라우저가 옛 파일과 새 파일을 섞지 않게 한다.
        run: python3 tools/stamp_version.py _site "${GITHUB_SHA::7}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
